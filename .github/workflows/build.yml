name: Build

on:
  push:
    branches: [node22, node16]
  pull_request:
    branches: [node22, node16]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: node22
            node: '22.x'
          - branch: node16
            node: '16.x'
    if: github.ref_name == matrix.branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable || yarn install

      - name: Lint
        run: yarn lint

      - name: Type Check
        run: yarn tsc

      - name: Build
        run: yarn build

      - name: Upload dist artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.branch }}
          path: dist/
