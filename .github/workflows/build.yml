name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable || yarn install

      - name: Audit dependencies
        run: yarn npm audit --severity moderate
        continue-on-error: true

      - name: Lint
        run: yarn lint

      - name: Type Check
        run: yarn tsc

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-node22
          path: dist/
